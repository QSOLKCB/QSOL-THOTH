name: Validate QSOL-THOTH

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce Ready for review for PR validation
        if: github.event_name == 'pull_request'
        run: |
          if [ "${{ github.event.pull_request.draft }}" = "true" ]; then
            echo "FAIL: CODEX_REVIEW_REQUESTED => PR_DRAFT == FALSE"
            echo "Mark the pull request Ready for review before Codex review."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate public contracts
        run: python3 tools/thoth.py validate

      - name: Replay CONCAP conformance suite
        run: python3 tools/thoth.py conformance

      - name: Validate portable CONCAP bindings and schema semantics
        run: |
          python3 tools/concap_resolver.py validate-bindings
          python3 -m json.tool ai/concap-source-bindings.json >/dev/null
          python3 -m json.tool schema/concap-source-bindings.schema.json >/dev/null
          python3 -m json.tool schema/concap-object-index.schema.json >/dev/null
          python3 -m json.tool schema/concap-bootstrap.schema.json >/dev/null
          python3 -m json.tool schema/concap-resolution-receipt.schema.json >/dev/null
          python3 -m unittest tests.test_concap_schema -v

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Determinism smoke test
        run: |
          python3 tools/thoth.py route --intent comedy > /tmp/thoth-a.json
          python3 tools/thoth.py route --intent comedy > /tmp/thoth-b.json
          cmp /tmp/thoth-a.json /tmp/thoth-b.json

      - name: Frozen conformance report smoke test
        run: |
          python3 tools/thoth.py conformance > /tmp/conformance-a.json
          python3 tools/thoth.py conformance > /tmp/conformance-b.json
          cmp /tmp/conformance-a.json /tmp/conformance-b.json

      - name: ESS override smoke test
        run: python3 tools/thoth.py route --intent software_review --style australian_humour

      - name: Historical basis determinism smoke test
        run: |
          python3 tools/history_minset.py plan --dataset examples/history/world-history-scaffold.json > /tmp/history-plan-a.json
          python3 tools/history_minset.py plan --dataset examples/history/world-history-scaffold.json > /tmp/history-plan-b.json
          cmp /tmp/history-plan-a.json /tmp/history-plan-b.json
          python3 tools/history_minset.py pack --dataset examples/history/world-history-scaffold.json > /tmp/history-basis-a.json
          python3 tools/history_minset.py pack --dataset examples/history/world-history-scaffold.json > /tmp/history-basis-b.json
          cmp /tmp/history-basis-a.json /tmp/history-basis-b.json
          python3 tools/history_minset.py reconstruct --basis /tmp/history-basis-a.json > /tmp/history-reconstruction-a.json
          python3 tools/history_minset.py reconstruct --basis /tmp/history-basis-b.json > /tmp/history-reconstruction-b.json
          cmp /tmp/history-reconstruction-a.json /tmp/history-reconstruction-b.json
