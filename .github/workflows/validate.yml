name: Validate QSOL-THOTH

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce Ready for review for PR validation
        if: github.event_name == 'pull_request'
        run: |
          if [ "${{ github.event.pull_request.draft }}" = "true" ]; then
            echo "FAIL: CODEX_REVIEW_REQUESTED => PR_DRAFT == FALSE"
            echo "Mark the pull request Ready for review before Codex review."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate public contracts
        run: python3 tools/thoth.py validate

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Determinism smoke test
        run: |
          python3 tools/thoth.py route --intent comedy > /tmp/thoth-a.json
          python3 tools/thoth.py route --intent comedy > /tmp/thoth-b.json
          cmp /tmp/thoth-a.json /tmp/thoth-b.json

      - name: ESS override smoke test
        run: python3 tools/thoth.py route --intent software_review --style australian_humour
